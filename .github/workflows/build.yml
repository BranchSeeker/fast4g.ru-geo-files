name: build-geo
# Rolling build: daily 03:00 MSK + manual + pushes touching the build.

on:
  schedule:
    # 00:00 UTC = 03:00 MSK
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/**"
      - "data/**"
      - "tests/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: build-geo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Build geo files
        run: python -m scripts.build --out dist --refresh

      - name: Verify
        run: python -m scripts.verify dist

      - name: Xray smoke test
        run: python -m scripts.smoke_xray dist --cache .cache

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geo-files
          path: dist/
          retention-days: 14

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/* --clobber
            gh release edit latest --notes-file dist/RELEASE_NOTES.md
          else
            gh release create latest dist/* \
              --title "fast4g.ru geo files" \
              --notes-file dist/RELEASE_NOTES.md
          fi

      - name: Publish jsDelivr branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mirror="$(mktemp -d)"
          cp -a dist/. "$mirror/"
          cd "$mirror"
          git init -q
          git checkout -q -b release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA::12} $(date -u +%FT%TZ)"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin release
          echo "MIRROR_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Purge jsDelivr cache
        run: |
          sleep 5
          for file in geosite.dat geoip.dat \
                      HAPP-BLOCKED-ONLY.JSON HAPP-WHITELIST.JSON \
                      HAPP-BLOCKED-ONLY-JSDELIVR.JSON HAPP-WHITELIST-JSDELIVR.JSON \
                      SHA256SUMS build-info.json; do
            curl -fsS --retry 3 --max-time 20 \
              "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@release/${file}" \
              >/dev/null || true
          done
